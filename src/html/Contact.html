<!DOCTYPE html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ClimbPedia</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="page-header">
            <nav class="navbar-split">
                <a href="Home.html" class="top-logo"><b>ClimbPedia</b></a>
                <input type="text" placeholder="Search..." class="top-search-bar">
            </nav>
        </header>
        <section>
            <div class="main-holds">
                <h1 class="page-title-holds">Contact Us</h1>
                <style>
                    body {
                        background-image: url('WebsiteImages/Contact-Us-Background-Image.jpg');
                        background-repeat: no-repeat;
                        background-attachment: fixed;
                        background-size: cover;
                        background-position: center -80px;
                    }
                </style>
            </div>
            <div class="sydney-gyms">
                <h1 class="gyms-title">Contact us here</h1>
                <article class="about-us-box">
                    <div class="gym-info">
                        <h2 class="gym-name">Our Contacts</h2>
                        <h3 class="about-us-explanation">Email: ClimbPedia@notarealemail.com<br>Instagram: @oscarmitbo</h3>
                    </div>

            </div>
        </section>
        <footer class="site-footer">
            <div class="footer-top">
                <h1 class="site-name-footer">ClimbPedia</h1>
                <a href="https://www.instagram.com/oscarmitbo/" class="instagram-link">
                    <img class="instagram-logo" src="WebsiteImages/Instagram-Logo.webp" alt="Instagram Logo">
                </a>
            </div>
            <div class="footer-middle">
                <div class="about-us">
                    <h1 class="about-us-title">About us</h1>
                    <a href="Information.html" class="information">Information about ClimbPedia</a>
                </div>
                <div class="need-help">
                    <h1 class="need-help-title">Need help?</h1>
                    <a href="Contact.html" class="contact-us">Contact us</a>
                    <a href="Sitemap.html" class="sitemap">Sitemap</a>
                </div>
            </div>
            <div class="footer-bottom">
                <h1 class="creator-text">Created by Oscar Dodd for ClimbPedia</h1>
            </div>
        </footer>

</html>
